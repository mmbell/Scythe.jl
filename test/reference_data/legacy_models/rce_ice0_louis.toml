    p = "BoundaryConditions(nothing, nothing, nothing, nothing, true)"
    rho_c = "BoundaryConditions(nothing, nothing, nothing, nothing, true)"
    rho_d = "BoundaryConditions(nothing, nothing, nothing, nothing, true)"
    rho_r = "BoundaryConditions(nothing, nothing, nothing, nothing, true)"
    rho_t = "BoundaryConditions(nothing, nothing, nothing, nothing, true)"
    rho_v = "BoundaryConditions(nothing, nothing, nothing, nothing, true)"
