# Legacy-pin overlay: simulations/ocean_warm_bubble/scythe_config.toml + this = what
# benchmarks/ocean_warm_bubble.jl built with no SCYTHE_OWB_* / SCYTHE_REFSTATE set (the
# golden owb_default.toml, --mode quick).
[output]
formats = ["csv"]                    # BENCHMARK_OUTPUT_FORMATS
restart_interval = 0.0

[reference_state]
consistent_qss = false
hydrostatic    = false

[physics.microphysics]
ice = "none"
condensate_transform = "none"
rain_transform = "none"
vapor_transform = "none"             # legacy: the vapor slot is the density perturbation (pre-Stage 1)

[physics.boundary_layer]
scheme = "louis"

[physics.surface]
stability = false

[numerics]
state_dependent_si = false
temperature = "energy"               # legacy: T from the total-energy retrieval (pre-2026-10-14)

[boundary_conditions]
vertical_scalars = "d2"             # legacy: one wall condition, ground AND lid
vertical_scalars_lid = "d2"
